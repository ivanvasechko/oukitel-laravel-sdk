name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  php:
    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['12', '13']
        dependencies: [lowest, stable]
        exclude:
          - laravel: '13'
            php: '8.2'
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
          tools: composer:v2
      - name: Select framework and compatible Testbench
        env:
          LARAVEL: ${{ matrix.laravel }}
        run: |
          case "$LARAVEL" in
            12) testbench=10 ;;
            13) testbench=11 ;;
            *) exit 1 ;;
          esac
          composer require --dev --no-update "laravel/framework:^$LARAVEL.0" "orchestra/testbench:^$testbench.0"
      - run: composer update --prefer-dist --no-interaction --prefer-${{ matrix.dependencies }}
      - run: composer validate --strict
      - run: composer pint -- --test
      - run: composer phpstan
      - name: Tests (coverage gate activates with production source)
        shell: bash
        run: |
          if find src -name '*.php' -print -quit | grep -q .; then
            composer test-coverage
          else
            composer test
          fi
      - run: composer audit
  integration:
    name: Redis and archived consumer / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        laravel: ['12', '13']
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: redis, zip
          coverage: none
          tools: composer:v2
      - name: Select supported framework
        env:
          LARAVEL: ${{ matrix.laravel }}
        run: |
          case "$LARAVEL" in
            12) testbench=10 ;;
            13) testbench=11 ;;
            *) exit 1 ;;
          esac
          composer require --dev --no-update "laravel/framework:^$LARAVEL.0" "orchestra/testbench:^$testbench.0"
          composer update --prefer-dist --no-interaction
      - run: composer test -- tests/Integration/RedisOwnershipTest.php
        env:
          OUKITEL_TEST_REDIS: '1'
          REDIS_HOST: 127.0.0.1
      - run: php tests/Distribution/check.php ${{ matrix.laravel }}
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  quality:
    name: Quality gate
    if: always()
    needs: [php, integration, secrets]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          PHP_RESULT: ${{ needs.php.result }}
          SECRET_RESULT: ${{ needs.secrets.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: test "$PHP_RESULT" = success && test "$SECRET_RESULT" = success && test "$INTEGRATION_RESULT" = success
